<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=500, initial-scale=1" />

    <meta name="author" content="Mohammadreza Parsafard" />

    <title>PopTunes</title>
    <link rel="stylesheet" href="./css/water.css" />

    <style>
      .card-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
        width: 200px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card-image {
        max-width: 100%;
        border-radius: 8px;
      }

      .song-info {
        margin-top: 10px;
        text-align: left;
        width: 100%;
      }

      .song-info p {
        margin: 5px 0;
        display: flex;
        justify-content: space-between;
      }

      .song-info .label {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PopTunes</h1>
      <p>Feel the Rhythm of Pop</p>
    </header>

    <nav id="menu">
      <!-- Dynamically create your menu category buttons here -->
    </nav>

    <hr />

    <main>
      <h2 id="selected-artist">
        <!-- Dynamically update the selected category title -->
      </h2>

      <div id="song-cards" class="card-container">
        <!-- Cards will be dynamically added here -->
      </div>
    </main>

    <script src="./js/artists.js"></script>
    <script src="./js/songs.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
